name: office_super_app
description: "Offline Office SuperApp for Android and Windows."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  http: ^1.2.0
  serious_python: ^0.8.0
  syncfusion_flutter_pdfviewer: ">=28.2.7 <35.0.0"
  syncfusion_flutter_datagrid: ">=28.2.7 <35.0.0"
  syncfusion_flutter_core: ">=28.2.7 <35.0.0"
  csv: ^6.0.0
  excel: ^4.0.3
  vsc_quill_delta_to_html: ^1.0.4
  flutter_quill: 11.6.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - app/app.zip
