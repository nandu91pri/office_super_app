name: office_super_app
description: "Offline Office SuperApp for Android and Windows."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  http: ^1.2.0
  serious_python: ^0.8.0
  syncfusion_flutter_pdfviewer: ^26.1.41
  syncfusion_flutter_datagrid: ^26.1.41
  syncfusion_flutter_core: ^26.1.41
  csv: ^6.0.0
  excel: ^4.0.3
  flutter_quill: ^10.8.2
  vsc_quill_delta_to_html: ^1.0.4
  

dependency_overrides:
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - app/app.zip
